services:
  sentinellite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinellite
    init: true
    restart: unless-stopped
    environment:
      SENTINELLITE_LOG_LEVEL: INFO
      SENTINELLITE_LOG_FILE: /app/logs/host_auth.log
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    stop_grace_period: 15s


